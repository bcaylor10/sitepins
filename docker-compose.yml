services:
  mongo:
    image: mongo:7
    # Single-node replica set: better-auth and the services use transactions.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the set on first run; healthy once this node is primary.
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "var s; try { s = rs.status().myState } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) } quit(s === 1 ? 0 : 1)",
        ]
      interval: 5s
      timeout: 10s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    expose:
      - "4000"
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/sitepins?replicaSet=rs0}
      NODE_ENV: production
      PORT: "4000"
      BASE_URL: ${BASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TOKEN_EXPIRE: ${JWT_TOKEN_EXPIRE:-7d}
      SANDBOX_ENCRYPTION_KEY: ${SANDBOX_ENCRYPTION_KEY}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: app/Dockerfile
      args:
        # Public values only: these are inlined into the client bundle at build time.
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:4000/api/v1}
        NEXT_PUBLIC_HP_WS_URL: ${NEXT_PUBLIC_HP_WS_URL:-ws://localhost:4000/api/v1/editor/collab}
        NEXT_PUBLIC_BUCKET_URL: ${NEXT_PUBLIC_BUCKET_URL:-}
        NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME:-Sitepins}
        NEXT_PUBLIC_BRAND_URL: ${NEXT_PUBLIC_BRAND_URL:-https://sitepins.com}
        NEXT_PUBLIC_GIT_APP_NAME: ${NEXT_PUBLIC_GIT_APP_NAME:-}
        NEXT_PUBLIC_GITHUB_APP_NAME: ${NEXT_PUBLIC_GITHUB_APP_NAME:-}
        NEXT_PUBLIC_GITLAB_CLIENT_ID: ${NEXT_PUBLIC_GITLAB_CLIENT_ID:-}
        NEXT_PUBLIC_BRAND_SLUG: ${NEXT_PUBLIC_BRAND_SLUG:-sitepins}
        NEXT_PUBLIC_BRAND_LOGO: ${NEXT_PUBLIC_BRAND_LOGO:-/images/logo.svg}
        NEXT_PUBLIC_BRAND_LOGO_DARK: ${NEXT_PUBLIC_BRAND_LOGO_DARK:-/images/logo-white.svg}
        NEXT_PUBLIC_BRAND_LOGO_ICON: ${NEXT_PUBLIC_BRAND_LOGO_ICON:-/images/logo-icon.svg}
        NEXT_PUBLIC_BRAND_LOGO_WIDTH: ${NEXT_PUBLIC_BRAND_LOGO_WIDTH:-136}
        NEXT_PUBLIC_BRAND_LOGO_HEIGHT: ${NEXT_PUBLIC_BRAND_LOGO_HEIGHT:-40}
        NEXT_PUBLIC_BRAND_FAVICON: ${NEXT_PUBLIC_BRAND_FAVICON:-/images/favicon.png}
        NEXT_PUBLIC_TERMS_URL: ${NEXT_PUBLIC_TERMS_URL:-https://sitepins.com/terms}
        NEXT_PUBLIC_PRIVACY_URL: ${NEXT_PUBLIC_PRIVACY_URL:-https://sitepins.com/privacy-policy}
        NEXT_PUBLIC_SUPPORT_URL: ${NEXT_PUBLIC_SUPPORT_URL:-https://sitepins.com/contact}
        NEXT_PUBLIC_UPDATES_URL: ${NEXT_PUBLIC_UPDATES_URL:-https://updates.sitepins.com}
        NEXT_PUBLIC_STATUS_URL: ${NEXT_PUBLIC_STATUS_URL:-https://status.sitepins.com}
        NEXT_PUBLIC_COMMUNITY_URL: ${NEXT_PUBLIC_COMMUNITY_URL:-https://discord.gg/KrpvHfqcNA}
        NEXT_PUBLIC_DOCS_URL: ${NEXT_PUBLIC_DOCS_URL:-https://docs.sitepins.com}
        NEXT_PUBLIC_SOURCE_URL: ${NEXT_PUBLIC_SOURCE_URL:-https://github.com/sitepins/sitepins}
    expose:
      - "3000"
    restart: unless-stopped
    environment:
      # Server-side secrets: runtime only, never build args.
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY}
    depends_on:
      - api

volumes:
  mongo-data: